<!DOCTYPE html>
<html>
<head>
<title>Guess the Number</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
background-color: #1a1025;
color: #e0d4ff;
font-family: 'Poppins', Arial, sans-serif;
margin: 0;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
text-align: center;
}

.container {
max-width: 420px;
width: 100%;
padding: 20px;
}

h1 {
color: #c084fc;
font-weight: 600;
font-size: 2.3em;
margin-bottom: 12px;
}

p {
font-size: 1.1em;
margin-bottom: 30px;
}

input {
padding: 14px;
font-size: 20px;
width: 150px;
text-align: center;
border-radius: 8px;
border: 2px solid #a855f7;
margin-bottom: 20px;
background-color: #2e1a47;
color: #ffffff;
font-family: 'Poppins', sans-serif;
outline: none;
}

button {
padding: 14px 32px;
font-size: 17px;
background-color: #a855f7;
color: white;
border: none;
border-radius: 8px;
cursor: pointer;
font-weight: 600;
font-family: 'Poppins', sans-serif;
margin: 8px;
}

button:hover {
background-color: #9333ea;
}

.new-game {
background-color: transparent;
border: 2px solid #c084fc;
color: #c084fc;
}

.new-game:hover {
background-color: #c084fc;
color: #1a1025;
}

#message {
margin-top: 30px;
font-size: 19px;
font-weight: 500;
min-height: 28px;
}

#attempts {
margin-top: 12px;
font-size: 15px;
opacity: 0.8;
}
</style>
</head>
<body>
<div class="container">
<h1>Guess the Number</h1>
<p>I'm thinking of a number between 1 and 1000</p>

<input type="number" id="guessInput" placeholder="Type here" min="1" max="1000">
<br>
<button onclick="checkGuess()">Guess</button>
<button class="new-game" onclick="newGame()">New Game</button>

<p id="message"></p>
<p id="attempts">Attempts: 0</p>
</div>

<script>
let secretNumber = Math.floor(Math.random() * 1000) + 1;
let attempts = 0;

function checkGuess() {
const userGuess = Number(document.getElementById("guessInput").value);
const message = document.getElementById("message");
const attemptsText = document.getElementById("attempts");

if (!userGuess || userGuess < 1 || userGuess > 1000) {
message.textContent = "Please enter a number between 1 and 1000";
message.style.color = "#f87171";
return;
}

attempts++;
attemptsText.textContent = "Attempts: " + attempts;

if (userGuess === secretNumber) {
message.textContent = "Congratulations!!! You got it in " + attempts + " tries!";
message.style.color = "#4ade80";
} else if (userGuess < secretNumber) {
message.textContent = "Too low! Try a higher number.";
message.style.color = "#facc15";
} else {
message.textContent = "Too high! Try a lower number.";
message.style.color = "#f87171";
}

document.getElementById("guessInput").value = "";
document.getElementById("guessInput").focus();
}

function newGame() {
secretNumber = Math.floor(Math.random() * 1000) + 1;
attempts = 0;
document.getElementById("message").textContent = "";
document.getElementById("attempts").textContent = "Attempts: 0";
document.getElementById("guessInput").value = "";
document.getElementById("guessInput").focus();
}

// Press Enter to guess
document.getElementById("guessInput").addEventListener("keyup", function(event) {
if (event.key === "Enter") {
checkGuess();
}
});
</script>
</body>
</html>
