<!DOCTYPE html>
<html>
<head>
<title>Guess the Number</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
background-color: #1a1025;
color: #e0d4ff;
font-family: 'Poppins', Arial, sans-serif;

display: flex;

text-align: center;
}

.container {
max-width: 420px;
width: 100%;
padding: 20px;
}

h1 {
color: #c084fc;
font-weight: 600;
font-size: 2.3em;
margin-bottom: 12px;
}

p {
font-size: 1.1em;
margin-bottom: 30px;
}
  .dfficulty {
    margin-bottom: 25px;
    }
  .difficulty button {
    margin: 5px;
    padding: 10px 18px;
    font-size: 15px;
    }
  
input {
padding: 14px;
font-size: 20px;

border-radius: 8px;
border: 2px solid #a855f7;
margin-bottom: 20px;

font-family: 'Poppins', sans-serif;
outline: none;
}

button {
padding: 14px 32px;
font-size: 17px;
background-color: #a855f7;
color: white;
border: none;
border-radius: 8px;
cursor: pointer;
font-weight: 600;

margin: 8px;
}

button:hover {
background-color: #9333ea;
}

.new-game {
background-color: transparent;
border: 2px solid #c084fc;
color: #c084fc;
}

.new-game:hover {
background-color: #c084fc;
color: #1a1025;
}

#message {
margin-top: 30px;
font-size: 19px;
font-weight: 500;
min-height: 28px;
}

#info {
  margin-top: 12px;
  font-size: 15px;
  opacity: 0.85;
  }
</style>
</head>
<body>
<div class="container">
<h1>Guess the Number</h1>

<div class="difficulty">
  <p>Choose Difficulty:</p>
  <button onclick="setDifficulty('easy')">Easy</button>
  <button onclick="setDifficulty('medium')">Medium</button>
  <button onclick="setDifficulty('hard')">Hard</button>
</div>

  <p id= "rangeText">Select a difficulty to start</p>

  <input type="number" id="guessInput" placeholders="Type here" disabled>
  <br>
<button onclick="checkGuess()" id="guessBtn" disabled>Guess</button>
<button class="new-game" onclick="newGame()">New Game</button>

<p id="message"></p>
<p id="info"></p>
</div>

<script>
let secretNumber;
let maxNumber;
let maxAttempts;
let attempts = 0;
let gameStarted = false;

function setDifficulty(level) {
  if (level === 'easy') {
    maxNumber = 100;
    maxAttemps = 10;
    } else if (level=== 'medium') {
    maxNumber = 500;
    maxAttempts = 8;
    } else {
    maxNumber = 1000;
    maxAttempts = 7;
    }

  secretNumber = Math.floor(Math.random() * maxNumber) + 1;
  attempts = 0;
  gameStarted = true;

  document.getElementById("rangeText").textContent = 'I'm thinking of a number between 1 and ${maxNumber}';
  document.getElementById("info").textContent = 'Attempts left: ${maxAttempts}';
  document.getElementById("message").textContent = "";
  document.getElementById("guessInput").disabled = false;
  document.getElementById("guessBtn").disabled = false;
  document.getElementById("guessInput").value= = "";
  document.getElementById("guessInput").focus();

  function checkGuess() {
    if (!gameStarted) return;
  
const userGuess = Number(document.getElementById("guessInput").value);
const message = document.getElementById("message");
const info = document.getElementById("info");

if (!userGuess || userGuess < 1 || userGuess > maxNumber) {
message.textContent = 'Please enter a number between 1 and ${maxNumber}';
message.style.color = "#f87171";
return;
}

attempts++;
    const attemptsLeft = maxAttempts - attempts;
    info.textContent = 'Attempts left: ${attemptsLeft}';

if (userGuess === secretNumber) {
message.textContent = 'Congratulations!!! You got it in ${attempts} tries!';
message.style.color = "#4ade80";
  
  confetti({
    particleCount:170,
    spread: 70,
    origin: { y: 0.6 }
    });
  endGame();
} else if (attempts >= maxAttempts) {
message.textContent = 'Game Over! The number was ${secretNumber}';
message.style.color = "#f87171";
  endGame();
} else if (userGuess < secretNumber) {
  message.textContent = "Too low! Try a higher number.";
  message.style.color = "#facc15";
} else {
message.textContent = "Too high! Try a lower number.";
message.style.color = "#f87171";
}

document.getElementById("guessInput").disabled = true;
document.getElementById("guessInput").focus();
}

  function endGame() {
    document.getElementById("guessInput").disabled = true;
    document.getElementById("guessBtn").disabled = true;
    gameStarted = false;

  funtion newGame() {
    document.getElementById("rangeText").textContent = "Select a difficulty to start";
    document.getElementById("message").textContent = "";
    document.getElementById("info").textContent = "";
    document.getElementById("guessInput").value = "";
    document.getElementById("guessInput").disabled = true;
    document.getElementById("guessBtn").disabled = true;
    gameStarted = false;
    }

// Press Enter to guess
document.getElementById("guessInput").addEventListener("keyup", function(event) {
if (event.key === "Enter") {
checkGuess();
}
});
</script>
</body>
</html>
